name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  module:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - acp
          - cache/redis
          - document
          - document/pdf
          - durable/gormstore
          - durable/pgstore
          - httpagent
          - management
          - management/harness
          - memory/pgvector
          - memory/qdrant
          - retrieval
          - retrieval/cohere
          - retrieval/qdrant
          - retrieval/vertexai
          - tools/database
          - tools/practical
    # pgstore、gormstore 和 management 使用真实数据库；每个矩阵任务独享服务容器。
    # cache/redis、memory/pgvector 与 memory/qdrant 在 CI 中没有 Redis、pgvector、Qdrant 服务，外部服务测试跳过，只覆盖编译、vet 与 lint。
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd "mysqladmin ping -ptest --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    env:
      GOAGENT_PGSTORE_DSN: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      GOAGENT_GORMSTORE_PG_DSN: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
      GOAGENT_GORMSTORE_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/mysql
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      # 全部模块与同一份核心源码联调：固定为 v0.67.1，pgstore 依赖其中的 core/durable/leasestore 与 session.Deleter，management 依赖其中的 ReconciliationStore、FilterHistory 与对应的 storetest 用例；cache/redis、memory/pgvector 依赖其中的 cache.Bytes 与 memorytest。
      - name: Checkout management core
        uses: actions/checkout@v4
        with:
          repository: kart-io/goagent
          ref: 138c86f299fb78035038976876d3793ea1491bcf
          path: .goagent-core

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Use local contrib modules
        working-directory: ${{ github.workspace }}
        run: |
          workspace_dir="$RUNNER_TEMP/goagent-contrib-workspace"
          mkdir -p "$workspace_dir"
          (cd "$workspace_dir" && GOWORK=off go work init)
          export GOWORK="$workspace_dir/go.work"
          while IFS= read -r mod; do
            go work use "$(dirname "$mod")"
          done < <(find "$GITHUB_WORKSPACE" -name go.mod -not -path '*/.git/*' -not -path "$GITHUB_WORKSPACE/.goagent-core/*" | sort)
          go work use "$GITHUB_WORKSPACE/.goagent-core"
          go work edit -go=1.27.0 -toolchain=go1.27.3
          echo "GOWORK=$GOWORK" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      # 数据库重启与同步提交测试需要专用容器（GOAGENT_PGSTORE_CONTAINER），在 CI 中自动跳过
      - name: Test
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml
