name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  module:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - acp
          - document
          - document/pdf
          - durable/pgstore
          - httpagent
          - retrieval
          - retrieval/cohere
          - retrieval/qdrant
          - retrieval/vertexai
          - tools/database
          - tools/practical
    # 只有 pgstore 的测试会连接数据库，其余模块未设置 DSN 时不受影响
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      GOAGENT_PGSTORE_DSN: postgres://postgres:test@127.0.0.1:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Use local contrib modules
        working-directory: ${{ github.workspace }}
        run: |
          workspace_dir="$RUNNER_TEMP/goagent-contrib-workspace"
          mkdir -p "$workspace_dir"
          (cd "$workspace_dir" && GOWORK=off go work init)
          export GOWORK="$workspace_dir/go.work"
          while IFS= read -r mod; do
            go work use "$(dirname "$mod")"
          done < <(find "$GITHUB_WORKSPACE" -name go.mod -not -path '*/.git/*' | sort)
          go work edit -go=1.27.0 -toolchain=go1.27.3
          echo "GOWORK=$GOWORK" >> "$GITHUB_ENV"

      - name: Vet
        run: go vet ./...

      # 数据库重启与同步提交测试需要专用容器（GOAGENT_PGSTORE_CONTAINER），在 CI 中自动跳过
      - name: Test
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
          args: --config=${{ github.workspace }}/.golangci.yml
